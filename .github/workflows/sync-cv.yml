name: Sync CV from Dropbox

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the CV from Dropbox
        run: |
          curl -fsSL -o cv_new.pdf \
            "https://www.dropbox.com/scl/fi/c4uq7ef84mt263tydrm8i/Dawis_Kim_CV.pdf?rlkey=i1wwnm8q14e2rxq02g4kyxkgn&st=96sv37r7&raw=1"
          if [ "$(head -c 4 cv_new.pdf)" != "%PDF" ]; then
            echo "Dropbox did not return a PDF"; exit 1
          fi

      - name: Commit if the PDF changed
        id: commit
        run: |
          if cmp -s cv_new.pdf Dawis_Kim_CV.pdf; then
            echo "CV unchanged"; rm cv_new.pdf; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mv cv_new.pdf Dawis_Kim_CV.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dawis_Kim_CV.pdf
          git commit -m "Sync CV from Dropbox"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
